name: Build macOS (.dmg) & Windows (.exe) Installers

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Vue.js Frontend
        run: |
          npm --prefix frontend install
          npm --prefix frontend run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies & build macOS DMG
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U "yt-dlp[default]" deno yt-dlp-ejs pyinstaller
          python scripts/build/build_installer.py
      - name: Upload macOS DMG Installer
        uses: actions/upload-artifact@v4
        with:
          name: Stream-Cloner-macOS-DMG
          path: dist/Stream-Cloner-macOS.dmg

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Vue.js Frontend
        run: |
          npm --prefix frontend install
          npm --prefix frontend run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies & build Windows EXE
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U "yt-dlp[default]" deno yt-dlp-ejs pyinstaller
          python scripts/build/build_installer.py
      - name: Upload Windows EXE Installer
        uses: actions/upload-artifact@v4
        with:
          name: Stream-Cloner-Windows-EXE
          path: dist/Stream-Cloner-Windows.exe
