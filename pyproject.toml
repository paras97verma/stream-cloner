[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-cloner"
version = "2.0.0"
description = "Production-ready YouTube Ultra-HD Video, Playlist, and Audio Studio"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "peivee"}
]
dependencies = [
    "yt-dlp>=2025.11.12",
    "yt-dlp-ejs>=0.3.0",
    "deno>=2.0.0",
    "pywebview>=5.0.0",
    "bottle>=0.12.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "certifi>=2024.2.2",
    "imageio-ffmpeg>=0.5.1",
    "darkdetect>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
stream-cloner = "stream_cloner.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore:.*urllib3 v2 only supports OpenSSL.*:UserWarning",
    "ignore:.*Support for Python version 3.9 has been deprecated.*:UserWarning",
]
